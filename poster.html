<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MYTHORIA — affiche</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cinzel+Decorative:wght@700;900&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
<style>
html,body{margin:0;background:#000;overflow:hidden}
#wrap{position:relative;width:540px;height:960px;overflow:hidden}
canvas{position:absolute;inset:0;width:540px;height:960px}
#title{position:absolute;left:0;right:0;top:56px;text-align:center;pointer-events:none}
.logo{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:62px;letter-spacing:4px;line-height:1;
  background:linear-gradient(#fffbe6 0%,#ffe08a 35%,#f0a830 62%,#a8620e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #3a1c04) drop-shadow(0 0 2px #2a1404) drop-shadow(0 0 26px rgba(255,190,80,.55))}
.sub{margin-top:10px;font-family:'Cinzel',serif;font-weight:900;font-size:15px;letter-spacing:7px;color:#fff3cf;text-shadow:0 2px 6px #000,0 0 14px rgba(255,200,100,.6)}
.line{width:260px;height:2px;margin:12px auto 0;background:linear-gradient(90deg,transparent,#ffd36a,transparent)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%),linear-gradient(transparent 70%,rgba(0,0,0,.6))}
</style></head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="vig"></div>
<div id="title"><div class="logo">MYTHORIA</div><div class="line"></div><div class="sub">LES FAILLES DU MYTHE</div></div></div>
<script type="module">
import * as THREE from 'three';
import { makeHero, preload, prop } from './src/client/three/assets.js';
import { THEMES, skyDome } from './src/client/three/world.js';
import { createComposer } from './src/client/three/look.js';
import { buildProc, glowSprite, glowTexture, sanctuaryCrystal } from './src/client/three/procedural.js';
import { PLAYABLE, HERO } from './src/shared/content.js';

const V = +(new URLSearchParams(location.search).get('v') || 1);
const LAYER = new URLSearchParams(location.search).get('layer') || '';
const notitle = new URLSearchParams(location.search).has('notitle') || !!LAYER;
if (notitle) document.getElementById('title').style.display = 'none';
const CFG = {
  1: { theme: 'aurore', sky: ['#1d3a9a', '#ff8a3a'], fog: '#d88a5a', sun: '#ffe2b0', sunI: 3.2, exp: 1.05, ground: '#6cbf52', rock: '#8a7c6a', dragon: ['#e8b04a', '#fff0b8'], glow: 0xffc870, part: '#ffe6a0' },
  2: { theme: 'arcane', sky: ['#0a0628', '#7a4ad8'], fog: '#3a2a78', sun: '#c8b0ff', sunI: 2.6, exp: 1.15, ground: '#5e5798', rock: '#3e3866', dragon: ['#8a5ad8', '#e0d0ff'], glow: 0xa070ff, part: '#c8a8ff', crystal: true },
  3: { theme: 'givre', sky: ['#060f2a', '#4a9ad8'], fog: '#1e4a78', sun: '#cfe6ff', sunI: 2.6, exp: 1.15, ground: '#dfe9f5', rock: '#6a7c98', dragon: ['#6fb8e8', '#eaf8ff'], glow: 0x7fdcff, part: '#dff6ff' },
}[V];

const cv = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true, alpha: LAYER === 'fly' });
r.setPixelRatio(2); r.setSize(540, 960, false);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = CFG.exp;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.add(skyDome({ skyTop: CFG.sky[0], skyBot: CFG.sky[1] }));
scene.fog = new THREE.Fog(CFG.fog, 45, 160);
const cam = new THREE.PerspectiveCamera(40, 540 / 960, 0.5, 400);
cam.position.set(0, 6.4, 22.5); cam.lookAt(0, 4.1, 0);
scene.add(new THREE.HemisphereLight(CFG.sky[1], '#302030', 1.3));
const sun = new THREE.DirectionalLight(CFG.sun, CFG.sunI); sun.position.set(-6, 14, 10); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -6, near: 1, far: 50 }); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun);
const back = new THREE.DirectionalLight(CFG.split ? '#6ad0ff' : CFG.sky[1], 2.2); back.position.set(6, 6, -10); scene.add(back);
if (CFG.split) { const l = new THREE.PointLight('#5ab8ff', 60, 30); l.position.set(-8, 5, 4); scene.add(l); const l2 = new THREE.PointLight('#ff6a2a', 60, 30); l2.position.set(8, 5, 4); scene.add(l2); }

// île flottante
const top = new THREE.Mesh(new THREE.CylinderGeometry(11, 10.5, 1, 40), new THREE.MeshStandardMaterial({ color: CFG.ground, flatShading: true }));
top.position.y = -0.5; top.receiveShadow = true; scene.add(top);
const under = new THREE.Mesh(new THREE.ConeGeometry(10.5, 12, 14, 3), new THREE.MeshStandardMaterial({ color: CFG.rock, flatShading: true }));
under.rotation.x = Math.PI; under.position.y = -7; scene.add(under);
// cercle de runes au sol
const rune = new THREE.Mesh(new THREE.RingGeometry(5.6, 6, 64), new THREE.MeshBasicMaterial({ color: CFG.glow, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false }));
rune.rotation.x = -Math.PI / 2; rune.position.set(0, 0.03, 1); scene.add(rune);
// lueur derrière les héros
const halo = glowSprite(CFG.glow, 26); halo.position.set(0, 5, -5); halo.material.opacity = V === 1 ? 0.35 : 0.55; scene.add(halo);
if (CFG.crystal) { const cr = sanctuaryCrystal('#b48cff'); cr.group.scale.setScalar(3.2); cr.group.position.set(0, 7.5, -7); scene.add(cr.group); cr.update(1.3, 1); }
// rochers / arbres sur le bord arrière
const T = THEMES[CFG.theme];
for (let i = 0; i < 9; i++) { const a = Math.PI * (1.08 + i * 0.105); if (Math.abs(Math.cos(a)) < 0.75) continue; try { const o = await prop(T.props[i % T.props.length][0], { scale: 1.6, tint: T.tintProps }); o.position.set(Math.cos(a) * 9.6, 0, Math.sin(a) * 8.6); scene.add(o); } catch (e) {} }
// îlots au loin
for (const [x, y, z, s] of [[-14, 9, -18, 1.2], [15, 12, -24, 1.6], [-20, 3, -30, 2], [19, 2, -14, 0.9]]) {
  const g = new THREE.Group();
  const t2 = new THREE.Mesh(new THREE.CylinderGeometry(2.2 * s, 2.5 * s, 0.5, 9), new THREE.MeshStandardMaterial({ color: CFG.ground, flatShading: true }));
  const b2 = new THREE.Mesh(new THREE.ConeGeometry(2.4 * s, 5 * s, 9), new THREE.MeshStandardMaterial({ color: CFG.rock, flatShading: true })); b2.rotation.x = Math.PI; b2.position.y = -2.7 * s;
  g.add(t2, b2); g.position.set(x, y, z); scene.add(g);
  try { const o = await prop(T.props[0][0], { scale: 1.3 * s, tint: T.tintProps }); o.position.y = 0.25; g.add(o); } catch (e) {}
}
// nuages
for (let i = 0; i < 26; i++) { const c = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: new THREE.Color(CFG.fog).lerp(new THREE.Color('#fff'), 0.4), transparent: true, opacity: 0.7, depthWrite: false })); c.position.set((Math.random() - 0.5) * 70, -6 - Math.random() * 8, -10 - Math.random() * 40); c.scale.set(20 + Math.random() * 16, 7 + Math.random() * 4, 1); scene.add(c); }
// nuages à l'horizon, derrière les héros
for (let i = 0; i < 18; i++) { const c = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: new THREE.Color(CFG.fog).lerp(new THREE.Color('#fff'), 0.55), transparent: true, opacity: 0.8, depthWrite: false })); c.position.set((Math.random() - 0.5) * 60, -1 + Math.random() * 5, -32 - Math.random() * 20); c.scale.set(18 + Math.random() * 14, 5 + Math.random() * 4, 1); scene.add(c); }
// particules
const n = 160, pg = new THREE.BufferGeometry(), pp = new Float32Array(n * 3);
for (let i = 0; i < n; i++) { pp[i * 3] = (Math.random() - 0.5) * 26; pp[i * 3 + 1] = Math.random() * 14; pp[i * 3 + 2] = (Math.random() - 0.5) * 18; }
pg.setAttribute('position', new THREE.BufferAttribute(pp, 3));
scene.add(new THREE.Points(pg, new THREE.PointsMaterial({ size: 0.22, map: glowTexture(), color: CFG.part, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })));
// dragons
const dr = buildProc('dragon', { color: CFG.dragon[0], belly: CFG.dragon[1], horns: true }); dr.root.scale.setScalar(2.3); dr.play('run'); dr.update(0.6);
dr.root.position.set(-6.4, 6.6, -12); dr.root.rotation.set(0.05, 1.35, 0.2);
if (CFG.split) { const d2 = buildProc('dragon', { color: '#6fb8e8', belly: '#eaf8ff', horns: true }); d2.root.scale.setScalar(2.2); d2.play('run'); d2.update(0.2); d2.root.position.set(6.4, 8.8, -13); d2.root.rotation.set(0.05, -1.35, -0.2); scene.add(d2.root); }

// hauteur du modèle seul (sans les lueurs ni particules)
function heightOf(o) { o.updateMatrixWorld(true); const b = new THREE.Box3(), t = new THREE.Box3(); o.traverse(m => { if ((m.isMesh || m.isSkinnedMesh) && !m.isSprite && !m.isPoints && m.visible && !(m.material && m.material.transparent) && !m.userData.isOutline) { if (m.geometry) { m.geometry.computeBoundingBox(); t.copy(m.geometry.boundingBox).applyMatrix4(m.matrixWorld); b.union(t); } } }); return b.isEmpty() ? 2 : Math.max(0.4, b.max.y - Math.max(b.min.y, o.position.y)); }
// ---- les héros : pyramide sur des gradins de pierre ----
const ids = PLAYABLE.map(c => c.id);
const fly = ids.filter(id => HERO[id].fly);
const front = ['kaelis', 'solenne', 'malakar', 'vael'];
let rest = ids.filter(id => !HERO[id].fly && !front.includes(id));
rest.sort((a, b) => ['nevra', 'morvak', 'myra', 'elwyn', 'cerf', 'golem'].includes(b) - ['nevra', 'morvak', 'myra', 'elwyn', 'cerf', 'golem'].includes(a));
if (CFG.split) { const Lf = ['aube', 'givre', 'sylve', 'neutre']; }
await preload(ids);
const SIZES = [5, 6, 8], ROWS = [front];
let k0 = 0; for (const n of SIZES) { ROWS.push(rest.slice(k0, k0 + n)); k0 += n; }
if (k0 < rest.length) ROWS[ROWS.length - 1].push(...rest.slice(k0));
const stone = new THREE.MeshStandardMaterial({ color: new THREE.Color(CFG.rock).multiplyScalar(0.75), flatShading: true }), stone2 = new THREE.MeshStandardMaterial({ color: new THREE.Color(CFG.rock).multiplyScalar(0.6), flatShading: true });
const place = [];
ROWS.forEach((row, k) => {
  const z = 5 - k * 1.7, y = k * 0.85, sp = [1.45, 1.3, 1.15, 1.0][k] || 1, w = (row.length - 1) * sp;
  if (k) { const st = new THREE.Mesh(new THREE.BoxGeometry(w + 2.2, y, 1.75), k % 2 ? stone : stone2); st.position.set(0, y / 2, z); st.castShadow = st.receiveShadow = true; scene.add(st);
    const lip = new THREE.Mesh(new THREE.BoxGeometry(w + 2.3, 0.12, 1.8), new THREE.MeshStandardMaterial({ color: CFG.glow, emissive: CFG.glow, emissiveIntensity: 0.25, flatShading: true })); lip.position.set(0, y + 0.02, z); scene.add(lip); }
  // ordre : les plus forts au centre
  const ord = []; row.forEach((id, i) => { if (i % 2) ord.push(id); else ord.unshift(id); });
  ord.forEach((id, i) => place.push({ id, x: (i - (ord.length - 1) / 2) * sp, z: z + (k ? 0 : 0.2), y, k }));
});
const acts = [];
for (const p of place) {
  const a = await makeHero(p.id, { star: p.k === 0 ? 3 : 2, lite: false });
  a.holder.scale.multiplyScalar((p.k === 0 ? 1.85 : 1.55) / heightOf(a.holder));
  a.holder.position.set(p.x, p.y, p.z); a.holder.rotation.y = Math.atan2(cam.position.x - p.x, cam.position.z - p.z);
  const roll = Math.random(); a.play(p.k === 0 ? 'attack' : roll < 0.3 ? 'attack' : roll < 0.45 ? 'cheer' : 'idle', { force: true });
  a.holder.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(a.holder); acts.push(a);
}
const topY = (ROWS.length - 1) * 0.85;
const flyPos = { follets: [-2.9, topY + 2.0, 1.6], dragonnet: [3.4, topY + 3.0, 0.8], ignar: [0.6, topY + 3.1, -3.2] };
const flyH = [], flyA = [];
for (const id of (LAYER === 'bg' ? [] : fly)) {
  const a = await makeHero(id, { star: 3 });
  a.holder.scale.multiplyScalar((id === 'ignar' ? 3.0 : id === 'follets' ? 0.9 : 1.5) / heightOf(a.holder)); const [x, y, z] = flyPos[id] || [0, topY + 3, 0];
  a.holder.position.set(x, y, z); a.holder.rotation.y = Math.atan2(cam.position.x - x, cam.position.z - z) + (id === 'ignar' ? -0.75 : x < 0 ? 0.4 : -0.4); a.play('idle', { force: true });
  scene.add(a.holder); acts.push(a); flyH.push(a.holder); flyA.push(a);
}
for (const a of acts) a.update(0.3 + Math.random() * 0.4);
const post = createComposer(r, scene, cam, { bloom: true, strength: 0.55, threshold: 1.0, radius: 0.55, samples: 4 });
post.setSize(540, 960);
if (LAYER === 'fly') {
  scene.children.forEach(o => { if (!o.isLight && !flyH.includes(o)) o.visible = false; }); r.setClearColor(0x000000, 0);
  for (const a of flyA) a.t = 0;
  window.__step = dt => { for (const a of flyA) a.update(dt); r.render(scene, cam); };
  window.__step(0); window.__ready = true;
}
let fr = 0;
function loop() { if (LAYER === 'fly') return; fr++; for (const a of acts) a.update(fr < 3 ? 0.02 : 0); post.render(); if (fr < 6) requestAnimationFrame(loop); else { document.fonts.ready.then(() => { window.__ready = true; }); } }
loop();
</script>
</body></html>
